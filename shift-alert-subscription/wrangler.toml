name = "shift-alert-subscription"
main = "billing-server/src/worker.js"
compatibility_date = "2026-08-14"

# Preserve runtime text variables configured in the Cloudflare dashboard.
keep_vars = true

[vars]
WEEK_PASS_AMOUNT_PAISE = "3600"
THIRTY_DAY_PASS_AMOUNT_PAISE = "5400"
WEEK_PASS_HOURS = "168"
THIRTY_DAY_ACCESS_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "canada-shift-watcher-db"
database_id = "65f930e7-63ec-453e-b3bf-c80da8113d92"
migrations_dir = "billing-server/migrations"
