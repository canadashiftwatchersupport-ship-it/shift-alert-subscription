<!doctype html><html><head><meta charset="utf-8"><style>body{width:300px;padding:16px;font:14px system-ui;color:#162238}h1{margin:0 0 8px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:9px 0}input,button{padding:10px;border-radius:7px;border:1px solid #ccd5e3}button{background:#ff9900;border:0;font-weight:700;cursor:pointer}.muted{color:#64748b;font-size:12px;line-height:1.4}.plans{display:flex;gap:8px}.plans button{background:#eaf2ff;color:#125fc9}</style></head><body>
<h1>Canada Shift Watcher</h1><p class="muted">Free to download. Monitor matching listings and open the official page. Optional navigation can move through intermediate screens. You review details, complete verification, and click Submit yourself.</p>
<label>Email<input id="email" type="email" placeholder="Use the email used at checkout"></label><label>License token<input id="token" placeholder="Sent after payment"></label>
<button id="activate">Activate license</button><div class="plans"><button data-plan="day">C$15 Day Pass</button><button data-plan="month">C$75 30-Day Pass</button></div>
<label><input id="watching" type="checkbox"> Enable matching alerts</label><p id="status" class="muted"></p>
<script src="config.js"></script><script src="popup.js"></script></body></html>
